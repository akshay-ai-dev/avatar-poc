<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Dev Page</title>
<style>
  :root{--bg:#0b0d10;--panel:#11151a;--line:#262b33;--ink:#e8eaed;--dim:#9aa3af;--ok:#34d399;--acc:#3b82f6;--err:#f87171;--hi:#fde047}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
  .wrap{max-width:600px;margin:0 auto;padding:14px 16px 40px}
  h1{font-size:16px;margin:4px 0 12px}
  canvas{width:100%;height:auto;display:block;border-radius:14px;background:#000}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  select,textarea,button{font:15px system-ui;border-radius:9px;border:1px solid var(--line);background:#0f1216;color:var(--ink);padding:9px}
  select{flex:1;min-width:0} textarea{width:100%;resize:vertical}
  button{background:#1c2027;cursor:pointer;min-height:40px} button.p{background:var(--acc);border-color:var(--acc);color:#fff}
  button:disabled{opacity:.4;cursor:default}
  .dim{color:var(--dim);font-size:13px} .big{font:600 18px ui-monospace,monospace;color:var(--ok)}
  .err{color:var(--err)}
  #chat{margin-top:12px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
  .bubble{margin:6px 0;padding:8px 10px;border-radius:10px;background:#1a1f26;white-space:pre-wrap}
  .bubble .meta{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
  .bubble span.c{color:var(--hi)}
  .bubble.cut{border-left:3px solid var(--err)}
  #metrics{font:12px ui-monospace,monospace;color:var(--dim);white-space:pre-wrap;margin-top:10px}
</style></head><body><div class="wrap">
<h1>Avatar dev page · INT8 MuseTalk + split-v2 Kokoro · 10 fps</h1>
<canvas id="cv" width="512" height="512"></canvas>
<div class="row">
  <button id="open" class="p">Open session</button><button id="close" disabled>Close</button>
  <select id="accent" disabled></select>
  <label class="dim"><input type="checkbox" id="mute"> mute</label>
</div>
<div class="row"><span id="status" class="dim">press Open session</span></div>
<div class="row"><textarea id="text" rows="3">Hello! **Bob** picked up the map, and Pam met him by the big maple tree. We will be fine, he promised, but maybe we should move quickly.</textarea></div>
<div class="row">
  <button id="say" class="p" disabled>Speak (Ctrl+Enter)</button>
  <button id="interrupt" disabled>Interrupt</button>
  <span class="dim">TTFF</span> <span id="ttff" class="big">—</span>
</div>
<div id="chat"></div>
<div id="metrics"></div>
<div class="dim" style="margin-top:10px" id="foot"></div>
</div>
<script src="livekit-client.umd.min.js"></script>
<script src="config.js"></script>
<script>
/* Two modes:
   - served by the dev API (/dev?k=KEY): opens sessions over HTTP, speaks with POST .../say;
   - static copy (tools/make_dev_site.py writes config.js with window.AVATAR_DEV_SITE): joins the
     prepared room with a short-lived token and speaks with the `dev_say` data command. */
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const KEY = Q.get('k') || '';
const SITE = window.AVATAR_DEV_SITE || null;
const CAP_DELAY = Q.get('cd') !== null ? Number(Q.get('cd')) : 40;
const api = (path, opt = {}) => fetch(`api/${path}${path.includes('?') ? '&' : '?'}k=${encodeURIComponent(KEY)}`,
  Object.assign({headers: {'Content-Type': 'application/json'}}, opt)).then(async r => {
    const b = r.headers.get('content-type')?.includes('json') ? await r.json() : null;
    if (!r.ok) throw new Error((b && b.message) || r.status); return b; });
const im = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const asset = (aid, name) => SITE ? `assets/${name === 'background.png' ? '' : aid + '/'}${name}`
                                  : `api/assets/${aid}/${name}?k=${encodeURIComponent(KEY)}`;

/* blink: the POC's Erlang-2 scheduler, wall-clock driven */
class Blink {
  constructor(n, fps) { this.n = n; this.fps = fps || 25; this.dur = n / this.fps; this.speaking = false;
                        this.t0 = null; this.dbl = false; this.next = performance.now() / 1000 + this.gap(); }
  gap() { const th = this.speaking ? 1.1018 : 1.6427, cap = this.speaking ? 4.5 : 6.0;
          const on = -th * (Math.log(1 - Math.random()) + Math.log(1 - Math.random()));
          return Math.max(0.45, Math.min(on, cap) - this.dur); }
  tick() { const now = performance.now() / 1000;
    if (this.t0 !== null) { const k = Math.floor((now - this.t0) * this.fps);
      if (k >= this.n) { this.t0 = null; if (this.dbl) { this.dbl = false; this.next = now + 0.12; } return null; } return k; }
    if (now >= this.next) { this.t0 = now; this.dbl = Math.random() < 0.12; if (!this.dbl) this.next = now + this.dur + this.gap(); return 0; }
    return null; }
}

/* compositor: background (cover) + person + blink tile + live mouth patch masked by patch_alpha */
const cv = $('#cv'), ctx = cv.getContext('2d', {alpha: false});
const pcv = document.createElement('canvas'), pctx = pcv.getContext('2d');
let L = null, video = null, running = false;
async function setup(av) {
  const [bg, base, sprite, mask] = await Promise.all(['background.png', 'base_rgba.png', 'blink_sprite.png', 'patch_alpha.png']
    .map(n => im(asset(av.id, n))));
  L = {a: av, bg, base, sprite, mask, blink: new Blink(av.blink.n, av.blink.fps)};
  pcv.width = av.patch_box[2]; pcv.height = av.patch_box[3];
  draw();
}
function draw() {
  if (!L) return;
  const {a, bg, base, sprite, mask, blink} = L;
  const s = Math.max(512 / bg.width, 512 / bg.height), w = bg.width * s, h = bg.height * s;
  ctx.drawImage(bg, (512 - w) / 2, (512 - h) / 2, w, h);
  ctx.drawImage(base, 0, 0, 512, 512);
  const k = blink.tick();
  if (k !== null && k > 0) { const [ex, ey, ew, eh] = a.eye_box; ctx.drawImage(sprite, k * ew, 0, ew, eh, ex, ey, ew, eh); }
  if (video && video.readyState >= 2 && video.videoWidth > 0) {
    const [px, py, pw, ph] = a.patch_box;
    pctx.globalCompositeOperation = 'source-over'; pctx.clearRect(0, 0, pw, ph);
    pctx.drawImage(video, 0, 0, pw, ph, 0, 0, pw, ph);
    pctx.globalCompositeOperation = 'destination-in'; pctx.drawImage(mask, 0, 0, pw, ph);
    ctx.drawImage(pcv, px, py);
  }
}

/* TEXT STREAM: each word arrives on the tick where it starts being spoken; shown at
   arrival + CAP_DELAY + offset, highlighted while spoken. One bubble per turn. */
const turns = new Map();       // turn -> {el, due: [], shown: 0}
const stats = window.AVATAR_STREAM = {messages: 0, words: 0, late: 0};
function bubble(turn) {
  let t = turns.get(turn);
  if (!t) {
    const el = document.createElement('div'); el.className = 'bubble';
    el.innerHTML = `<span class="meta">turn ${turn}</span>`;
    $('#chat').appendChild(el);
    t = {el, due: [], shown: 0}; turns.set(turn, t);
  }
  return t;
}
function onWords(m) {
  const now = performance.now(), t = bubble(m.turn);
  stats.messages++; stats.words += m.items.length;
  m.items.forEach((it, k) => t.due.push({at: now + CAP_DELAY + it.off * 1000, w: it.w, d: it.d * 1000,
                                          newline: m.newline && k === 0 && t.shown > 0}));
}
function tickWords() {
  const now = performance.now();
  for (const t of turns.values()) {
    while (t.due.length && t.due[0].at <= now) {
      const x = t.due.shift();
      if (now - x.at > 150) stats.late++;
      if (x.newline) t.el.appendChild(document.createTextNode('\n'));
      const sp = document.createElement('span'); sp.textContent = x.w; sp.className = 'c';
      t.el.appendChild(sp); t.shown++;
      setTimeout(() => { sp.className = ''; }, Math.max(60, x.d));
      $('#chat').scrollTop = $('#chat').scrollHeight;
    }
  }
}
function onTurnDone(m) {
  const t = bubble(m.turn);
  if (m.interrupted) { t.due = []; t.el.classList.add('cut'); }
  t.el.querySelector('.meta').textContent = `turn ${m.turn} · ${m.interrupted ? 'interrupted' : 'done'}`;
}
function loop() { if (!running) return; draw(); tickWords(); frames++; requestAnimationFrame(loop); }

/* LiveKit */
let room = null, audioEl = null, sid = null, turn = 0, frames = 0, statsTimer = null, metricsTimer = null;
const send = m => room && room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(m)),
                                                            {reliable: true, topic: 'avatar-cmd'});
function status(t, err) { $('#status').textContent = t; $('#status').className = err ? 'err' : 'dim'; }
function fillAccents(list, cur) {
  const sel = $('#accent'); sel.innerHTML = '';
  for (const a of list) { const o = document.createElement('option'); o.value = a.id; o.textContent = a.label; sel.appendChild(o); }
  sel.value = cur; sel.disabled = false;
}
async function clientStats() {
  if (!room) return;
  const out = {cmd: 'client_stats', fps_raf: Math.round(frames / 10), words_late: stats.late,
               visibility: document.visibilityState};
  frames = 0;
  try {
    const pc = room.engine.pcManager.subscriber.pc;
    const reports = new Map();
    (await pc.getStats()).forEach(r => reports.set(r.id, r));
    for (const r of reports.values()) {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        Object.assign(out, {frames_decoded: r.framesDecoded, frames_dropped: r.framesDropped,
          freeze_count: r.freezeCount, freeze_s: r.totalFreezesDuration, packets_lost: r.packetsLost,
          jitter_buffer_ms: r.jitterBufferEmittedCount ? Math.round(1000 * r.jitterBufferDelay / r.jitterBufferEmittedCount) : null});
      }
      if (r.type === 'inbound-rtp' && r.kind === 'audio' && r.totalSamplesReceived)
        out.audio_concealed_ratio = +(r.concealedSamples / r.totalSamplesReceived).toFixed(4);
      if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') {
        out.rtt_ms = r.currentRoundTripTime != null ? Math.round(r.currentRoundTripTime * 1000) : null;
        const lc = reports.get(r.localCandidateId), rc = reports.get(r.remoteCandidateId);
        out.candidate_type = `${lc ? lc.candidateType : '?'}->${rc ? rc.candidateType : '?'}`;
      }
    }
  } catch (e) { /* stats are best effort */ }
  send(out);
}
async function open() {
  $('#open').disabled = true; status('opening…');
  try {
    let url, token, s;
    if (SITE) { s = SITE.session; url = SITE.url; token = SITE.tokens[Math.floor(Math.random() * SITE.tokens.length)]; }
    else { s = await api('sessions', {method: 'POST', body: JSON.stringify({avatar_id: Q.get('avatar') || 'Man_-_1'})});
           url = s.livekit_url; token = s.viewer_token; sid = s.sid; }
    await setup(s.avatar);
    fillAccents(s.accents, s.accent);
    room = new LivekitClient.Room({adaptiveStream: false, dynacast: false});
    room.on(LivekitClient.RoomEvent.TrackSubscribed, t => {
      if (t.kind === 'video') { video = t.attach(); video.muted = true; video.playsInline = true;
                                video.style.display = 'none'; document.body.appendChild(video); }
      else { audioEl = t.attach(); audioEl.style.display = 'none'; audioEl.muted = $('#mute').checked;
             document.body.appendChild(audioEl); audioEl.play().catch(() => status('tap Speak to enable sound')); }
    });
    room.on(LivekitClient.RoomEvent.DataReceived, (payload, p, kind, topic) => {
      if (topic !== 'avatar') return;
      let m; try { m = JSON.parse(new TextDecoder().decode(payload)); } catch { return; }
      if (m.type === 'state') { fillAccents(m.accents, m.accent); turn = Math.max(turn, m.turn || 0);
                                $('#say').disabled = false; $('#interrupt').disabled = false; status(`connected · ${m.voice}`); }
      else if (m.type === 'utterance') { turn = Math.max(turn, m.turn); bubble(m.turn); }
      else if (m.type === 'words') onWords(m);
      else if (m.type === 'ttff') $('#ttff').textContent = m.ms + ' ms';
      else if (m.type === 'speaking') { if (L) L.blink.speaking = !!m.value; }
      else if (m.type === 'turn_done') onTurnDone(m);
      else if (m.type === 'error') status('service error: ' + m.code, true);
    });
    room.on(LivekitClient.RoomEvent.Reconnecting, () => status('reconnecting…'));
    room.on(LivekitClient.RoomEvent.Reconnected, () => status('connected'));
    room.on(LivekitClient.RoomEvent.Disconnected, () => { status('disconnected', true); teardown(); });
    await room.connect(url, token);
    running = true; requestAnimationFrame(loop);
    $('#close').disabled = false;
    send({cmd: 'hello'});
    statsTimer = setInterval(clientStats, 10000);
    if (!SITE) metricsTimer = setInterval(showMetrics, 2000);
  } catch (e) { status('open failed: ' + e.message, true); $('#open').disabled = false; }
}
function teardown() {
  running = false; clearInterval(statsTimer); clearInterval(metricsTimer);
  for (const el of [video, audioEl]) if (el && el.parentNode) el.remove();
  video = audioEl = null; room = null; draw();
  $('#open').disabled = false; $('#close').disabled = true; $('#say').disabled = true;
  $('#interrupt').disabled = true; $('#accent').disabled = true;
}
async function close() {
  const r = room; room = null;
  if (r) { try { await r.disconnect(); } catch {} }
  if (sid && !SITE) { try { await api(`sessions/${sid}`, {method: 'DELETE'}); } catch {} sid = null; }
  teardown(); status('closed');
}
async function speak() {
  if (audioEl) audioEl.play().catch(() => {});
  $('#ttff').textContent = '…';
  const text = $('#text').value, accent = $('#accent').value;
  try {
    if (SITE) send({cmd: 'dev_say', text, accent});
    else { const r = await api(`sessions/${sid}/say`, {method: 'POST', body: JSON.stringify({text, accent})});
           if (!r.accepted) status('not spoken: ' + r.reason, true); }
  } catch (e) { status('say failed: ' + e.message, true); }
}
async function showMetrics() {
  try { const m = await fetch(`../metrics?k=${encodeURIComponent(KEY)}`).then(r => r.json());
    const s = (m.per_session || []).find(x => x.sid === sid) || {};
    $('#metrics').textContent = `fps ${m.frames_per_s_30s}  t_frame ${m.t_frame_ms} ms  k_tts ${m.tts_ms_per_speech_s}  ` +
      `N_est ${m.est_max_all_speaking_live}  lag95 ${m.loop_lag_ms_p95} ms  gpu ${m.gpu_util}%\n` +
      `session: turn ${s.turn}  underruns ${s.underruns}  gaps ${s.gap_ticks}  ttff ${s.ttff_ms_last}  ahead ${s.frames_ahead}  ` +
      `words ${stats.words} in ${stats.messages} msgs  late ${stats.late}`;
  } catch {}
}
$('#open').onclick = open; $('#close').onclick = close; $('#say').onclick = speak;
$('#interrupt').onclick = () => send({cmd: 'interrupt', turn});
$('#accent').onchange = () => send({cmd: 'voice', accent: $('#accent').value});
$('#mute').onchange = () => { if (audioEl) audioEl.muted = $('#mute').checked; };
$('#text').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') speak(); });
window.addEventListener('pagehide', () => { if (sid && !SITE)
  fetch(`api/sessions/${sid}?k=${encodeURIComponent(KEY)}`, {method: 'DELETE', keepalive: true}); });
$('#foot').textContent = SITE ? `Static copy · tokens valid until ${SITE.expires_local}.`
                              : 'Served by the dev API. Words appear as they are spoken (display delay ' + CAP_DELAY + ' ms, ?cd=NN to adjust).';
</script></body></html>
